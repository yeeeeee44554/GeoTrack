services:
  namenode:
    image: apache/hadoop:3.4.1
    user: root
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./docker/hadoop:/opt/hadoop/etc/hadoop:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["if [ ! -d /hadoop/dfs/name/current ]; then hdfs namenode -format -force; fi; hdfs namenode"]
  datanode:
    image: apache/hadoop:3.4.1
    user: root
    hostname: datanode
    depends_on:
      - namenode
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
      - ./docker/hadoop:/opt/hadoop/etc/hadoop:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["hdfs datanode"]
  spark-master:
    build:
      context: ./docker
      dockerfile: spark-pandas.Dockerfile
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - "./Geolife Trajectories 1.3:/dataset:ro"
  spark-worker:
    build:
      context: ./docker
      dockerfile: spark-pandas.Dockerfile
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
    depends_on:
      - spark-master
    volumes:
      - "./Geolife Trajectories 1.3:/dataset:ro"
      - ./:/workspace
  postgres:
    image: ${POSTGRES_IMAGE:-mobilitydb/mobilitydb:latest}
    environment:
      POSTGRES_DB: geotrack
      POSTGRES_USER: geotrack
      POSTGRES_PASSWORD: geotrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      GEOTRACK_DATA_ROOT: /dataset
      GEOTRACK_SERVING_BACKEND: ${GEOTRACK_SERVING_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-postgresql://geotrack:geotrack@postgres:5432/geotrack}
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./jobs:/app/jobs
      - "./Geolife Trajectories 1.3:/dataset:ro"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
  spark-submit:
    build:
      context: ./docker
      dockerfile: spark-pandas.Dockerfile
    user: root
    profiles: ["batch"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint: ["/bin/bash", "-c"]
